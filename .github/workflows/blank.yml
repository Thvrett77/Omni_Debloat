# This is a basic workflow to help you get started with Actions

name: Mac Os 

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: macos-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upgrade Pip
        run: python -m pip install --upgrade pip
        
      # Runs a single command using the runners shell
      - name: Install the bundler
        run: pip install pyinstaller

      # Runs a set of commands using the runners shell
      - name: Bundle into a Mac os executable
        run: pyinstaller --noconfirm --onefile --console --optimize "2" --exclude-module "pydoc" --exclude-module "tkinter" --exclude-module "json" --exclude-module "xml" --exclude-module "html" --exclude-module "_tkinter" --exclude-module "Tkinter" --exclude-module "turtle" --exclude-module "curses" --exclude-module "unittest" --exclude-module "lib2to3" --exclude-module "idlelib" --exclude-module "pydoc_data" --exclude-module "smtplib" --exclude-module "ftplib" --exclude-module "hashlib" --exclude-module "hmac" --exclude-module "secrets" --exclude-module "ssl" --exclude-module "sqlite3" --exclude-module "csv" --exclude-module "tarfile" --exclude-module "zoneinfo" --exclude-module "gettext" --exclude-module "asyncio" --exclude-module "concurrent" --exclude-module "ctypes" --exclude-module "math" "src/main.py"


      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: dist/

